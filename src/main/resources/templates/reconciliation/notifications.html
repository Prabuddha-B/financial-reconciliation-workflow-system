<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Notifications</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">

  <!-- Page Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2><i class="bi bi-bell me-2"></i>Notifications</h2>
      <p class="text-muted mb-0">View all your system notifications</p>
    </div>
    <div>
      <span class="badge bg-primary me-2" th:text="${unreadCount} + ' unread'">0 unread</span>
    </div>
  </div>

  <!-- Success/Error messages -->
  <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
    <i class="bi bi-check-circle me-2"></i><span th:text="${successMessage}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
    <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${errorMessage}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <!-- Mark All Read -->
  <div class="mb-3">
    <form th:action="@{/notifications/mark-all-read}" method="post" class="d-inline">
      <button type="submit" class="btn btn-outline-secondary btn-sm" th:if="${not #lists.isEmpty(notifications)}">
        <i class="bi bi-check2-all me-1"></i>Mark all as read
      </button>
    </form>
  </div>

  <!-- Notification List -->
  <div class="card shadow-sm">
    <div class="list-group list-group-flush">
      <div th:each="notification : ${notifications}"
           class="list-group-item list-group-item-action"
           th:classappend="${!notification.isRead} ? 'bg-light' : ''">

        <div class="d-flex justify-content-between align-items-start">
          <div class="flex-grow-1 me-2">
            <div>
              <span th:if="${!notification.isRead}" class="badge bg-primary me-2">New</span>
              <span class="badge me-2" th:classappend="${notification.type == 'APPROVAL'} ? 'bg-warning' :
                                                                      ${notification.type == 'MESSAGE'} ? 'bg-info' :
                                                                      ${notification.type == 'SYSTEM'} ? 'bg-secondary' :
                                                                      ${notification.type == 'RECONCILIATION'} ? 'bg-success' :
                                                                      'bg-secondary'"
                    th:text="${notification.type}">TYPE</span>
              <strong th:text="${notification.title}">Title</strong>
            </div>
            <div class="text-muted small" th:text="${notification.message}">Message</div>
            <div class="text-muted small mt-1" th:text="${#temporals.format(notification.createdAt, 'yyyy-MM-dd HH:mm')}">Date</div>
          </div>
          <div class="d-flex gap-1">
            <a th:if="${notification.link}" th:href="${notification.link}" class="btn btn-sm btn-outline-primary">
              <i class="bi bi-eye"></i>
            </a>
            <form th:action="@{/notifications/delete/{id}(id=${notification.id})}" method="post" class="d-inline">
              <button type="submit" class="btn btn-sm btn-outline-danger"
                      onclick="return confirm('Delete this notification?');">
                <i class="bi bi-x"></i>
              </button>
            </form>
          </div>
        </div>

        <!-- Mark as Read button (if unread) -->
        <div th:if="${!notification.isRead}" class="mt-2">
          <form th:action="@{/notifications/mark-read/{id}(id=${notification.id})}" method="post" class="d-inline">
            <button type="submit" class="btn btn-sm btn-outline-secondary">
              <i class="bi bi-check me-1"></i>Mark as read
            </button>
          </form>
        </div>
      </div>

      <!-- Empty State -->
      <div th:if="${#lists.isEmpty(notifications)}" class="text-center py-5 text-muted">
        <i class="bi bi-bell-slash fs-1 d-block mb-2"></i>
        <h5>No notifications</h5>
        <p class="mb-0">When you receive notifications, they'll appear here.</p>
      </div>
    </div>
  </div>

</div>

</body>
</html>
