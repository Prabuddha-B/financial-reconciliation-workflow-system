<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <style>


        .frwss-footer {
            background: var(--bs-footer-bg, #f8fafc);
            border-top: 1px solid var(--bs-footer-border, rgba(0, 0, 0, 0.06));
            padding: 1.5rem 0;
            margin-top: auto;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .frwss-footer .footer-brand {
            color: var(--bs-footer-brand-color, #1a2332);
            font-weight: 700;
            font-size: 1.05rem;
            letter-spacing: 0.01em;
        }

        .frwss-footer .footer-system-name {
            color: var(--bs-footer-text-color, #475569);
            font-weight: 500;
            font-size: 0.9rem;
            letter-spacing: 0.02em;
        }

        /* Dark mode – FRWSS constitution */
        [data-bs-theme="dark"] .frwss-footer {
            --bs-footer-bg: #0f172a;
            --bs-footer-border: #334155;
            --bs-footer-brand-color: #f8fafc;
            --bs-footer-text-color: #cbd5e1;
        }

        /* Responsive fine‑tuning */
        @media (max-width: 767.98px) {
            .frwss-footer .footer-brand {
                font-size: 0.95rem;
            }
            .frwss-footer .footer-system-name {
                font-size: 0.8rem;
            }
        }
    </style>
</head>

<body>

<footer th:fragment="footer"
        class="frwss-footer border-top py-3 mt-auto">

    <div class="container-fluid">

        <div class="row align-items-center gy-2">

            <div class="col-md-6 text-center text-md-start">
                <small class="footer-brand">
                    © 2026 <strong>FRWSS</strong>
                </small>
            </div>

            <div class="col-md-6 text-center text-md-end">
                <small class="footer-system-name">
                    Financial Reconciliation & Workflow Support System
                </small>
            </div>

        </div>

    </div>

</footer>

</body>
</html>
