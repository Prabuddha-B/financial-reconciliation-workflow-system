<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="header(title)">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title th:text="${title}">FRWSS</title>

    <!-- CSRF Meta Tags - CRITICAL for POST requests -->
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        :root{

            --frwss-primary:#2563eb;
            --frwss-secondary:#64748b;
            --frwss-success:#16a34a;
            --frwss-warning:#f59e0b;
            --frwss-danger:#dc2626;

            --frwss-bg:#f8fafc;
            --frwss-surface:#ffffff;

            --frwss-border:#e2e8f0;

            --frwss-radius:14px;

            --frwss-shadow:
                    0 2px 6px rgba(15,23,42,.06),
                    0 12px 30px rgba(15,23,42,.04);

            /* ---- Semantic design system tokens (corrected) ---- */

            /* Surface hierarchy */
            --frwss-surface-1: #f8fafc;
            --frwss-surface-2: #ffffff;
            --frwss-surface-3: #f1f5f9;

            /* Text hierarchy */
            --frwss-text-primary: #0f172a;
            --frwss-text-secondary: #475569;
            --frwss-text-muted: #64748b;

            /* Radius scale */
            --frwss-radius-sm: 6px;
            --frwss-radius-md: 10px;
            --frwss-radius-lg: 14px;
            --frwss-radius-xl: 20px;

            /* Shadow scale – align with existing FRWSS shadow */
            --frwss-shadow-sm: 0 1px 3px rgba(15,23,42,.04), 0 1px 2px rgba(15,23,42,.06);
            --frwss-shadow-md: 0 4px 12px rgba(15,23,42,.06), 0 2px 6px rgba(15,23,42,.04);
            --frwss-shadow-lg: 0 2px 6px rgba(15,23,42,.06), 0 12px 30px rgba(15,23,42,.04);

            /* Motion */
            --frwss-transition-fast: 150ms ease;
            --frwss-transition-normal: 200ms ease;

        }

        body{

            font-family:'Inter',sans-serif;
            background:var(--frwss-bg);

        }

        .frwss-card{

            border:none;
            border-radius:var(--frwss-radius);
            box-shadow:var(--frwss-shadow);

        }

        .frwss-title{

            font-weight:700;

        }

        .frwss-subtitle{

            color: var(--frwss-text-muted);

        }

        /* ---- New utility classes ---- */

        .frwss-text-primary {
            color: var(--frwss-text-primary);
        }

        .frwss-text-secondary {
            color: var(--frwss-text-secondary);
        }

        .frwss-text-muted {
            color: var(--frwss-text-muted);
        }

        .frwss-page-header {
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--frwss-border);
        }

        .frwss-section-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            color: var(--frwss-text-primary);
        }

        .frwss-panel {
            background: var(--frwss-surface-2);
            border-radius: var(--frwss-radius-md);
            padding: 1.5rem;
            box-shadow: var(--frwss-shadow-sm);
        }

        .frwss-shadow-sm {
            box-shadow: var(--frwss-shadow-sm);
        }

        .frwss-shadow-md {
            box-shadow: var(--frwss-shadow-md);
        }

        .frwss-shadow-lg {
            box-shadow: var(--frwss-shadow-lg);
        }

    </style>

</head>

</html>
