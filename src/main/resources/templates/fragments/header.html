<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="header(title)">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title th:text="${title}">FRWSS</title>

    <!-- CSRF Meta Tags - CRITICAL for POST requests -->
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        :root{

            --frwss-primary:#2563eb;
            --frwss-secondary:#64748b;
            --frwss-success:#16a34a;
            --frwss-warning:#f59e0b;
            --frwss-danger:#dc2626;

            --frwss-bg:#f8fafc;
            --frwss-surface:#ffffff;

            --frwss-border:#e2e8f0;

            --frwss-radius:14px;

            --frwss-shadow:
                    0 2px 6px rgba(15,23,42,.06),
                    0 12px 30px rgba(15,23,42,.04);

        }

        body{

            font-family:'Inter',sans-serif;
            background:var(--frwss-bg);

        }

        .frwss-card{

            border:none;
            border-radius:var(--frwss-radius);
            box-shadow:var(--frwss-shadow);

        }

        .frwss-title{

            font-weight:700;

        }

        .frwss-subtitle{

            color:#64748b;

        }

    </style>

</head>

</html>
