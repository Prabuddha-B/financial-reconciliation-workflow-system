<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Compose Message</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">

  <!-- Page Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2><i class="bi bi-pencil-square me-2"></i>Compose Message</h2>
      <p class="text-muted mb-0">Send a message to another user</p>
    </div>
    <a href="/messages/inbox" class="btn btn-outline-secondary">
      <i class="bi bi-arrow-left me-1"></i>Back to Inbox
    </a>
  </div>

  <!-- Success/Error messages -->
  <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
    <i class="bi bi-check-circle me-2"></i><span th:text="${successMessage}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
    <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${errorMessage}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <!-- Compose Form -->
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <form th:action="@{/messages/send}" method="post" th:object="${message}">

        <!-- Recipient -->
        <div class="mb-3">
          <label class="form-label fw-semibold">To <span class="text-danger">*</span></label>
          <select th:field="*{recipientId}" class="form-select" required>
            <option value="">-- Select Recipient --</option>
            <option th:each="user : ${users}"
                    th:value="${user.userId}"
                    th:text="${user.username}">
              User
            </option>
          </select>
        </div>

        <!-- Subject -->
        <div class="mb-3">
          <label class="form-label fw-semibold">Subject <span class="text-danger">*</span></label>
          <input type="text" th:field="*{subject}" class="form-control" required placeholder="Enter message subject">
        </div>

        <!-- Content -->
        <div class="mb-3">
          <label class="form-label fw-semibold">Message <span class="text-danger">*</span></label>
          <textarea th:field="*{content}" class="form-control" rows="6" required
                    placeholder="Type your message here..."></textarea>
        </div>

        <!-- Reference Type (Optional) -->
        <div class="mb-3">
          <label class="form-label fw-semibold">Reference Type (Optional)</label>
          <select th:field="*{referenceType}" class="form-select">
            <option value="">None</option>
            <option value="RECONCILIATION">Reconciliation</option>
            <option value="WORKFLOW">Workflow</option>
            <option value="TAX">Tax</option>
            <option value="AUDIT">Audit</option>
          </select>
        </div>

        <!-- Reference ID (Optional) -->
        <div class="mb-3">
          <label class="form-label fw-semibold">Reference ID (Optional)</label>
          <input type="text" th:field="*{referenceId}" class="form-control" placeholder="e.g., 123">
        </div>

        <!-- Buttons -->
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-send me-1"></i>Send Message
          </button>
          <a href="/messages/inbox" class="btn btn-outline-secondary">
            <i class="bi bi-x-circle me-1"></i>Cancel
          </a>
        </div>

      </form>
    </div>
  </div>

</div>

</body>
</html>
