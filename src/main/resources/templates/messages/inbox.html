<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Messages</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    .message-item {
      transition: background-color 0.2s ease;
      cursor: pointer;
    }
    .message-item:hover {
      background-color: #f8f9fa !important;
    }
    .message-item.unread {
      background-color: #f0f7ff;
      border-left: 4px solid #0d6efd;
    }
    .message-item.unread:hover {
      background-color: #e8f0fe !important;
    }
    .message-item .badge-new {
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.6; }
      100% { opacity: 1; }
    }
    .from-badge {
      font-size: 0.8rem;
      padding: 0.2rem 0.6rem;
      border-radius: 1rem;
    }
  </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">

  <!-- Page Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2><i class="bi bi-envelope me-2"></i>Messages</h2>
      <p class="text-muted mb-0">View and manage your messages</p>
    </div>
    <div>
            <span class="badge bg-primary rounded-pill px-3 py-2 me-2"
                  th:if="${unreadCount != null and unreadCount > 0}">
                <i class="bi bi-envelope-paper me-1"></i>
                <span th:text="${unreadCount}">0</span> unread
            </span>
      <span class="badge bg-secondary rounded-pill px-3 py-2 me-2"
            th:if="${unreadCount == null or unreadCount == 0}">
                <i class="bi bi-check-all me-1"></i>All read
            </span>
      <a href="/messages/compose" class="btn btn-primary">
        <i class="bi bi-pencil-square me-1"></i>Compose
      </a>
    </div>
  </div>

  <!-- Tabs -->
  <ul class="nav nav-tabs mb-3">
    <li class="nav-item">
      <a class="nav-link" th:classappend="${activeTab == 'inbox'} ? 'active' : ''"
         th:href="@{/messages/inbox}">
        <i class="bi bi-inbox me-1"></i>Inbox
        <span th:if="${unreadCount > 0}" class="badge bg-danger ms-1" th:text="${unreadCount}">0</span>
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link" th:classappend="${activeTab == 'sent'} ? 'active' : ''"
         th:href="@{/messages/sent}">
        <i class="bi bi-send me-1"></i>Sent
      </a>
    </li>
  </ul>

  <!-- Success/Error messages -->
  <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
    <i class="bi bi-check-circle me-2"></i><span th:text="${successMessage}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
    <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${errorMessage}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <!-- Message List -->
  <div class="card shadow-sm">
    <div class="list-group list-group-flush">
      <div th:each="message : ${messages}"
           class="list-group-item list-group-item-action message-item"
           th:classappend="${activeTab == 'inbox' and !message.isRead} ? 'unread' : ''">

        <div class="d-flex justify-content-between align-items-start">
          <div class="flex-grow-1 me-2">
            <!-- Header: Status + Subject -->
            <div class="mb-1">
              <!-- ✅ FIX: Only show "New" in Inbox tab and when unread -->
              <span th:if="${activeTab == 'inbox' and !message.isRead}"
                    class="badge bg-primary badge-new me-2">New</span>
              <a th:href="@{/messages/view/{id}(id=${message.id})}" class="text-decoration-none text-dark fw-semibold">
                <span th:text="${message.subject}">Subject</span>
              </a>
            </div>

            <!-- From/To with user badges -->
            <div class="text-muted small">
                            <span th:if="${activeTab == 'inbox'}">
                                <i class="bi bi-arrow-right-short me-1"></i>
                                <strong>From:</strong>
                                <span class="badge bg-primary-subtle text-primary border border-primary-subtle from-badge"
                                      th:text="${message.senderName}">Sender</span>
                            </span>
              <span th:if="${activeTab == 'sent'}">
                                <i class="bi bi-arrow-right-short me-1"></i>
                                <strong>To:</strong>
                                <span class="badge bg-success-subtle text-success border border-success-subtle from-badge"
                                      th:text="${message.recipientName}">Recipient</span>
                            </span>
            </div>

            <!-- Preview -->
            <div class="text-muted small mt-1">
              <span th:text="${#strings.abbreviate(message.content, 120)}">Message preview...</span>
            </div>
          </div>

          <!-- Date/Time -->
          <div class="text-end text-muted small" style="min-width: 90px;">
            <div th:text="${#temporals.format(message.sentAt, 'dd MMM')}">Date</div>
            <div th:text="${#temporals.format(message.sentAt, 'HH:mm')}">Time</div>
          </div>
        </div>
      </div>

      <!-- Empty State -->
      <div th:if="${#lists.isEmpty(messages)}" class="text-center py-5 text-muted">
        <i class="bi bi-inbox fs-1 d-block mb-2"></i>
        <h5>No messages in your <span th:text="${pageTitle}">inbox</span></h5>
        <p class="mb-0">When you receive messages, they'll appear here.</p>
        <a href="/messages/compose" class="btn btn-outline-primary mt-3">
          <i class="bi bi-pencil-square me-1"></i>Compose Message
        </a>
      </div>
    </div>
  </div>

  <!-- Mark All Read Button (Inbox only) -->
  <div class="mt-3" th:if="${activeTab == 'inbox' and not #lists.isEmpty(messages) and unreadCount > 0}">
    <form th:action="@{/messages/mark-all-read}" method="post" class="d-inline">
      <button type="submit" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-check2-all me-1"></i>Mark all as read
      </button>
    </form>
  </div>

</div>

</body>
</html>
