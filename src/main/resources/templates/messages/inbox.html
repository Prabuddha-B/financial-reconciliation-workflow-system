<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Inbox - Messages</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">

  <!-- Page Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2><i class="bi bi-envelope me-2"></i>Messages</h2>
      <p class="text-muted mb-0">View and manage your messages</p>
    </div>
    <div>
      <span class="badge bg-primary me-2" th:text="${unreadCount} + ' unread'">0 unread</span>
      <a href="/messages/compose" class="btn btn-primary">
        <i class="bi bi-pencil-square me-1"></i>Compose
      </a>
    </div>
  </div>

  <!-- Tabs -->
  <ul class="nav nav-tabs mb-3">
    <li class="nav-item">
      <a class="nav-link active" th:href="@{/messages/inbox}">Inbox</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" th:href="@{/messages/sent}">Sent</a>
    </li>
  </ul>

  <!-- Success/Error messages -->
  <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
    <i class="bi bi-check-circle me-2"></i><span th:text="${successMessage}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
    <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${errorMessage}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <!-- Message List -->
  <div class="card shadow-sm">
    <div class="list-group list-group-flush">
      <div th:each="message : ${messages}" class="list-group-item list-group-item-action"
           th:classappend="${!message.isRead} ? 'bg-light' : ''">
        <div class="d-flex justify-content-between align-items-start">
          <div class="flex-grow-1 me-2">
            <div>
              <span th:if="${!message.isRead}" class="badge bg-primary me-2">New</span>
              <a th:href="@{/messages/view/{id}(id=${message.id})}" class="text-decoration-none text-dark">
                <strong th:text="${message.subject}">Subject</strong>
              </a>
            </div>
            <div class="text-muted small">
              From: User <span th:text="${message.senderId}">123</span>
            </div>
            <div class="text-muted small">
              <span th:text="${#strings.abbreviate(message.content, 100)}">Message preview...</span>
            </div>
          </div>
          <div class="text-end text-muted small" style="min-width: 100px;">
            <div th:text="${#temporals.format(message.sentAt, 'yyyy-MM-dd')}">Date</div>
            <div th:text="${#temporals.format(message.sentAt, 'HH:mm')}">Time</div>
          </div>
        </div>
      </div>

      <!-- Empty State -->
      <div th:if="${#lists.isEmpty(messages)}" class="text-center py-5 text-muted">
        <i class="bi bi-inbox fs-1 d-block mb-2"></i>
        <h5>No messages in your inbox</h5>
        <p class="mb-0">When you receive messages, they'll appear here.</p>
        <a href="/messages/compose" class="btn btn-outline-primary mt-3">
          <i class="bi bi-pencil-square me-1"></i>Compose Message
        </a>
      </div>
    </div>
  </div>

  <!-- Mark All Read Button -->
  <div class="mt-3" th:if="${not #lists.isEmpty(messages)}">
    <form th:action="@{/messages/mark-all-read}" method="post" class="d-inline">
      <button type="submit" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-check2-all me-1"></i>Mark all as read
      </button>
    </form>
  </div>

</div>

</body>
</html>
