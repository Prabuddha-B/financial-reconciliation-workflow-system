<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>View Message</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">

  <!-- Page Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2><i class="bi bi-envelope-open me-2"></i>View Message</h2>
    </div>
    <div class="d-flex gap-2">
      <a th:href="@{/messages/reply/{id}(id=${message.id})}" class="btn btn-primary">
        <i class="bi bi-reply me-1"></i>Reply
      </a>
      <a href="/messages/inbox" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left me-1"></i>Back to Inbox
      </a>
    </div>
  </div>

  <!-- Message Details -->
  <div class="card shadow-sm">
    <div class="card-header bg-light">
      <div class="d-flex justify-content-between align-items-center">
        <strong th:text="${message.subject}">Subject</strong>
        <span class="text-muted small" th:text="${#temporals.format(message.sentAt, 'yyyy-MM-dd HH:mm')}">Date</span>
      </div>
    </div>
    <div class="card-body">

      <!-- Sender & Recipient Info -->
      <div class="mb-3 pb-3 border-bottom">
        <div class="row">
          <div class="col-md-6">
            <span class="fw-semibold">From:</span>
            <!-- ✅ FIX: Show username with badge -->
            <span class="badge bg-primary-subtle text-primary border border-primary-subtle ms-1 px-3 py-2"
                  th:text="${message.senderName}">Sender</span>
          </div>
          <div class="col-md-6">
            <span class="fw-semibold">To:</span>
            <!-- ✅ FIX: Show username with badge -->
            <span class="badge bg-success-subtle text-success border border-success-subtle ms-1 px-3 py-2"
                  th:text="${message.recipientName}">Recipient</span>
          </div>
        </div>
        <div class="row mt-2">
          <div class="col-md-6">
            <span class="fw-semibold">Status:</span>
            <span th:if="${message.isRead}" class="badge bg-success">Read</span>
            <span th:if="${!message.isRead}" class="badge bg-primary">Unread</span>
          </div>
          <div class="col-md-6" th:if="${message.referenceType}">
            <span class="fw-semibold">Reference:</span>
            <span class="badge bg-secondary" th:text="${message.referenceType} + ' #' + ${message.referenceId}"></span>
          </div>
        </div>
      </div>

      <!-- Message Content -->
      <div class="mb-3">
        <div style="white-space: pre-wrap; line-height: 1.8;" th:text="${message.content}">Message content goes here...</div>
      </div>

      <!-- Actions -->
      <div class="mt-3 pt-3 border-top">
        <div class="d-flex gap-2">
          <a th:href="@{/messages/reply/{id}(id=${message.id})}" class="btn btn-primary">
            <i class="bi bi-reply me-1"></i>Reply
          </a>
          <form th:action="@{/messages/delete/{id}(id=${message.id})}" method="post" class="d-inline">
            <button type="submit" class="btn btn-outline-danger"
                    onclick="return confirm('Delete this message?');">
              <i class="bi bi-trash me-1"></i>Delete
            </button>
          </form>
        </div>
      </div>

    </div>
  </div>

</div>

<!-- At the bottom of each page -->
<div th:replace="~{fragments/scripts :: badgeStyles}"></div>
<div th:replace="~{fragments/scripts :: badgeScripts}"></div>

</body>
</html>
