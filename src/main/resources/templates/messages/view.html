<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: header('View Message')}"></head>

<style>
  .avatar-circle {
    width: 3rem;
    height: 3rem;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 1.1rem;
    flex-shrink: 0;
  }
  .message-body-panel {
    background: var(--frwss-surface-3);
    border-radius: var(--frwss-radius-md);
    padding: 1.25rem 1.5rem;
    max-width: 68ch;
    line-height: 1.8;
    white-space: pre-wrap;
  }
</style>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4 py-lg-5">

  <!-- ===================== Page Header ===================== -->
  <div class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-3 mb-4">
    <div>
      <h1 class="h3 mb-2"><i class="bi bi-envelope-open me-2"></i>View Message</h1>
      <p class="frwss-subtitle mb-0">Message details and conversation actions</p>
    </div>
    <div class="d-flex gap-2">
      <a th:href="@{/messages/reply/{id}(id=${message.id})}" class="btn btn-primary">
        <i class="bi bi-reply me-1"></i>Reply
      </a>
      <a href="/messages/inbox" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left me-1"></i>Back to Inbox
      </a>
    </div>
  </div>

  <!-- ===================== Message Details ===================== -->
  <div class="card shadow-sm">

    <!-- Message-card header: avatar + sender/recipient + timestamp -->
    <div class="card-header bg-white py-3">
      <div class="d-flex align-items-start gap-3">

        <div class="avatar-circle bg-primary-subtle text-primary"
             th:text="${#strings.toUpperCase(#strings.substring(message.senderName ?: '?', 0, 1))}">A</div>

        <div class="flex-grow-1">
          <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
            <div>
              <div class="fw-bold" th:text="${message.senderName}">Sender</div>
              <div class="text-muted small">
                to <span th:text="${message.recipientName}">Recipient</span>
              </div>
            </div>
            <div class="text-muted small" th:text="${#temporals.format(message.sentAt, 'dd MMM yyyy, HH:mm')}">Date</div>
          </div>

          <div class="mt-2 d-flex align-items-center gap-2 flex-wrap">
            <span th:if="${message.isRead}"
                  class="badge rounded-pill bg-success-subtle text-success-emphasis border border-success-subtle">Read</span>
            <span th:if="${!message.isRead}"
                  class="badge rounded-pill bg-primary-subtle text-primary-emphasis border border-primary-subtle">Unread</span>
            <span th:if="${message.referenceType}"
                  class="badge rounded-pill bg-secondary-subtle text-secondary-emphasis border border-secondary-subtle"
                  th:text="${message.referenceType} + ' #' + ${message.referenceId}"></span>
          </div>
        </div>
      </div>
    </div>

    <div class="card-body">

      <!-- Subject -->
      <h5 class="fw-bold mb-3" th:text="${message.subject}">Subject</h5>

      <!-- Message Content -->
      <div class="mb-3">
        <div class="message-body-panel" th:text="${message.content}">Message content goes here...</div>
      </div>

      <!-- Actions -->
      <div class="mt-3 pt-3 border-top">
        <div class="d-flex gap-2">
          <a th:href="@{/messages/reply/{id}(id=${message.id})}" class="btn btn-primary">
            <i class="bi bi-reply me-1"></i>Reply
          </a>
          <form th:action="@{/messages/delete/{id}(id=${message.id})}" method="post" class="d-inline">
            <button type="submit" class="btn btn-outline-danger"
                    onclick="return confirm('Delete this message?');">
              <i class="bi bi-trash me-1"></i>Delete
            </button>
          </form>
        </div>
      </div>

    </div>
  </div>

</div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>
<!-- ========================================== -->
<!-- INCLUDE SCRIPTS FRAGMENT                   -->
<!-- ========================================== -->
<div th:replace="~{fragments/scripts :: badgeStyles}"></div>
<div th:replace="~{fragments/scripts :: badgeScripts}"></div>

</body>
</html>
