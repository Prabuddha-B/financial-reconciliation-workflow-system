<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>FRWSS Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>

        /* ================= Login Animation ================= */

        @keyframes fadeIn {

            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        .login-card{

            border:1px solid #e7ebef !important;
            box-shadow:0 .6rem 1.4rem rgba(0,0,0,.08);
            animation: fadeIn .55s ease;

            transition:
                    transform .25s ease,
                    box-shadow .25s ease;

        }

        .login-card:hover{
            transform: translateY(-3px);
            box-shadow:0 .9rem 1.8rem rgba(0,0,0,.08)!important;
        }

        /* ================= Form Controls ================= */

        .form-control{
            border-radius:.6rem;
            padding:.75rem .9rem;
            transition:all .2s ease;
        }

        .form-control:focus{
            border-color:#0d6efd;
            box-shadow:0 0 0 .2rem rgba(13,110,253,.15);
        }


        /* ================= Login Button ================= */

        .btn-login{
            padding:.75rem;
            font-weight:600;
            transition:all .2s ease;
        }

        .btn-login:hover{
            transform:translateY(-1px);
        }

        /* ================= Background ================= */

        body{
            background:#eef2f7;
        }

    </style>
</head>

<body class="bg-light d-flex flex-column min-vh-100">

<main class="flex-grow-1 d-flex align-items-center justify-content-center">

    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">

                <div class="card login-card shadow-sm border-0">

            <div class="card-body p-4">

                <!-- ================= Branding ================= -->
                <div class="text-center mb-4">

                    <div class="rounded-circle bg-primary-subtle text-primary d-inline-flex align-items-center justify-content-center mb-3" style="width:72px;height:72px;">
                        <i class="bi bi-bank2 fs-1"></i>
                    </div>

                    <h2 class="fw-bold mb-2">
                        FRWSS
                    </h2>

                    <p class="text-secondary mb-1">
                        Financial Reconciliation & Workflow Support System
                    </p>

                    <small class="text-muted">
                        Sign in to access the system
                    </small>

                </div>

                <hr class="my-4">

                <!-- ================= Login Alert ================= -->
                <div th:if="${alertMessage != null}"
                     th:class="'alert alert-' + ${alertType} + ' shadow-sm d-flex align-items-center mb-4'">
                    <i class="bi bi-exclamation-circle-fill me-2"></i>
                    <span th:text="${alertMessage}"></span>
                </div>

                <!-- ================= Login Form ================= -->
                <form th:action="@{/login}" method="post">

                    <!-- Username -->
                    <div class="mb-3">

                        <label for="username" class="form-label fw-semibold">
                            Username
                        </label>

                        <input id="username" name="username" class="form-control" autocomplete="username" placeholder="Enter your username" required>

                    </div>


                    <!-- Password -->
                    <div class="mb-4">

                        <label for="password" class="form-label fw-semibold">
                            Password
                        </label>

                        <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" placeholder="Enter your password" required>

                    </div>


                    <!-- Login Button -->
                    <button type="submit" class="btn btn-primary btn-login w-100">
                        <i class="bi bi-box-arrow-in-right me-2"></i>
                        Sign In
                    </button>

                    <!-- ================= Security Notice ================= -->
                    <div class="text-center mt-4">
                        <small class="text-muted">
                            <i class="bi bi-shield-lock me-1"></i>
                            Secure access for authorized personnel only.
                        </small>
                    </div>

                    <div class="text-center mt-2">
                        <small class="text-secondary">
                            Version 1.0 • FRWSS • Group A
                        </small>
                    </div>

                </form>

            </div>
            </div>
        </div>
    </div>
    </div>
</main>

</body>
</html>
