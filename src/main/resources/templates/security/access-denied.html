<!DOCTYPE html>

    <title>Access Denied</title>

<body class="bg-light">

        <div class="card-body p-4">
            <h3 class="text-danger mb-3">Access Denied</h3>

            <a th:href="@{/ingestion/dashboard}" class="btn btn-secondary">

        </div>
    </div>
</div>
<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>
</body>

</html>
