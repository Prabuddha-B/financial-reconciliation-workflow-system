<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: header('Switch Account')}"></head>

<style>
    /* ============================================================
       FRWSS PRO UX/UI DESIGN - Switch Account (Centered Portal Style)
       ============================================================ */

    .main-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: calc(100vh - 200px);
        padding: 2rem;
    }

    .switch-card {
        max-width: 480px;
        width: 100%;
        background: white;
        border-radius: 20px;
        box-shadow: 0 8px 40px rgba(0, 0, 0, 0.08);
        padding: 2.5rem 2.5rem 2rem;
        border: 1px solid #f0f2f5;
    }

    /* Icon */
    .icon-wrapper {
        display: flex;
        justify-content: center;
        margin-bottom: 1.5rem;
    }

    .icon-wrapper .icon {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: #e7f1ff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.2rem;
        color: #0d6efd;
    }

    /* Title */
    .switch-title {
        text-align: center;
        font-weight: 700;
        font-size: 1.5rem;
        color: #1a2332;
        margin-bottom: 0.5rem;
    }

    .switch-subtitle {
        text-align: center;
        font-size: 0.95rem;
        color: #6c757d;
        margin-bottom: 1.75rem;
    }

    /* Current Role Badge */
    .current-role-badge {
        background: #f8f9fa;
        border-radius: 10px;
        padding: 0.75rem 1rem;
        text-align: center;
        margin-bottom: 1.5rem;
        border: 1px solid #e9ecef;
    }

    .current-role-badge .label {
        font-size: 0.75rem;
        color: #6c757d;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        font-weight: 600;
    }

    .current-role-badge .value {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1a2332;
        margin-top: 0.1rem;
    }

    /* Account List */
    .account-list {
        margin-bottom: 1.25rem;
    }

    .account-list .list-label {
        font-weight: 600;
        font-size: 0.9rem;
        color: #1a2332;
        margin-bottom: 0.5rem;
        display: block;
    }

    .account-option {
        border: 1.5px solid #e2e8f0;
        border-radius: 10px;
        padding: 0.6rem 0.75rem;
        margin-bottom: 0.5rem;
        transition: all 0.15s;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 0.75rem;
    }

    .account-option:hover {
        background: #f8f9ff;
        border-color: #86b7fe;
    }

    .account-option .form-check-input {
        cursor: pointer;
        width: 1.1rem;
        height: 1.1rem;
        border-radius: 50%;
        border: 2px solid #ced4da;
        transition: all 0.15s;
        flex-shrink: 0;
        margin: 0;
    }

    .account-option .form-check-input:checked {
        background-color: #0d6efd;
        border-color: #0d6efd;
    }

    .account-option .form-check-input:focus {
        box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.15);
    }

    .account-option .account-info {
        flex: 1;
    }

    .account-option .account-name {
        font-weight: 600;
        color: #1a2332;
        font-size: 0.95rem;
    }

    .account-option .account-role {
        font-size: 0.75rem;
        color: #6c757d;
    }

    /* Form */
    .form-label {
        font-weight: 600;
        font-size: 0.9rem;
        color: #1a2332;
        margin-bottom: 0.4rem;
    }

    .form-label i {
        color: #6c757d;
        margin-right: 0.4rem;
    }

    .form-control {
        border-radius: 10px;
        border: 1.5px solid #e2e8f0;
        padding: 0.7rem 1rem;
        font-size: 1rem;
        transition: all 0.15s;
        background: white;
    }

    .form-control:focus {
        border-color: #86b7fe;
        box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.1);
    }

    .form-text {
        font-size: 0.8rem;
        color: #6c757d;
        margin-top: 0.25rem;
    }

    .btn-switch {
        width: 100%;
        padding: 0.75rem;
        border-radius: 10px;
        font-weight: 600;
        font-size: 1rem;
        background: #0d6efd;
        color: white;
        border: none;
        transition: all 0.15s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.6rem;
        margin-top: 0.5rem;
    }

    .btn-switch:hover:not(:disabled) {
        background: #0b5ed7;
        transform: translateY(-2px);
        box-shadow: 0 4px 16px rgba(13, 110, 253, 0.35);
    }

    .btn-switch:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .btn-cancel {
        width: 100%;
        padding: 0.75rem;
        border-radius: 10px;
        font-weight: 600;
        font-size: 1rem;
        border: 1.5px solid #e2e8f0;
        transition: all 0.15s;
        background: white;
        color: #495057;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        margin-top: 0.5rem;
        text-decoration: none;
    }

    .btn-cancel:hover {
        background: #f8f9fa;
        border-color: #ced4da;
        transform: translateY(-2px);
        text-decoration: none;
        color: #495057;
    }

    .divider {
        border: none;
        border-top: 1px solid #e9ecef;
        margin: 1.25rem 0;
    }

    /* Alert messages */
    .alert {
        border: none;
        border-radius: 12px;
        padding: 0.75rem 1rem;
        font-weight: 500;
        font-size: 0.9rem;
        margin-bottom: 1rem;
    }

    .alert-danger {
        background: #f8d7da;
        color: #721c24;
    }

    .alert-success {
        background: #d1e7dd;
        color: #0f5132;
    }

    .alert-info {
        background: #cfe2ff;
        color: #084298;
    }

    .alert i {
        font-size: 1rem;
        margin-right: 0.5rem;
    }

    .alert .btn-close {
        font-size: 0.7rem;
    }

    .no-accounts-icon {
        text-align: center;
        font-size: 2.5rem;
        color: #dee2e6;
        margin-bottom: 0.5rem;
    }

    /* Responsive */
    @media (max-width: 576px) {
        .main-container {
            padding: 1rem;
            min-height: calc(100vh - 160px);
        }
        .switch-card {
            padding: 1.75rem 1.25rem 1.5rem;
        }
        .icon-wrapper .icon {
            width: 60px;
            height: 60px;
            font-size: 1.8rem;
        }
        .switch-title {
            font-size: 1.25rem;
        }
        .switch-subtitle {
            font-size: 0.85rem;
        }
        .form-control {
            font-size: 0.9rem;
            padding: 0.6rem 0.85rem;
        }
        .btn-switch,
        .btn-cancel {
            font-size: 0.9rem;
            padding: 0.6rem;
        }
        .account-option {
            padding: 0.5rem 0.6rem;
        }
        .account-option .account-name {
            font-size: 0.85rem;
        }
    }
</style>

<body class="d-flex flex-column min-vh-100 bg-light">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="flex-grow-1">

        <div class="container-fluid main-container">


            <!-- SWITCH ACCOUNT CARD-->
            <div class="switch-card">

                <!-- Success Message -->
                <div th:if="${successMessage}"
                     class="alert alert-success alert-dismissible fade show"
                     role="alert">

                    <i class="bi bi-check-circle-fill"></i>
                    <span th:text="${successMessage}"></span>

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="alert">
                    </button>

                </div>

                <!-- Error Message -->
                <div th:if="${errorMessage}"
                     class="alert alert-danger alert-dismissible fade show"
                     role="alert">

                    <i class="bi bi-exclamation-triangle-fill"></i>
                    <span th:text="${errorMessage}"></span>

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="alert">
                    </button>

                </div>

                <!-- Icon -->
                <div class="icon-wrapper">
                    <div class="icon">
                        <i class="bi bi-arrow-left-right"></i>
                    </div>
                </div>

                <!-- Title -->
                <h2 class="switch-title">Switch Account</h2>
                <p class="switch-subtitle">Select another enabled account within your current role</p>

                <!-- Current Role -->
                <div class="current-role-badge">
                    <div class="label">Current Role</div>
                    <div class="value" th:text="${userRole}">ADMIN</div>
                </div>

                <!-- Form -->
                <form th:action="@{/security/switch-account}"
                      th:object="${switchAccountRequest}"
                      method="post">

                    <!-- Eligible Accounts -->
                    <div th:if="${!#lists.isEmpty(eligibleAccounts)}">
                        <div class="account-list">
                            <span class="list-label">Select Account</span>

                            <div th:each="account : ${eligibleAccounts}">
                                <label class="account-option">
                                    <input class="form-check-input"
                                           type="radio"
                                           th:field="*{userId}"
                                           th:value="${account.userId}"
                                           required>
                                    <div class="account-info">
                                        <div class="account-name" th:text="${account.username}"></div>
                                        <div class="account-role"
                                             th:text="${#lists.isEmpty(account.roles)
                                             ? 'No Role'
                                             : #lists.toList(account.roles)[0].name.replace('ROLE_','')}">
                                            ADMIN
                                        </div>
                                    </div>
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- No Accounts -->
                    <div th:if="${#lists.isEmpty(eligibleAccounts)}">
                        <div class="no-accounts-icon">
                            <i class="bi bi-people"></i>
                        </div>
                        <div class="alert alert-info text-center">
                            <i class="bi bi-info-circle-fill"></i>
                            No other enabled accounts are available for this role.
                        </div>
                    </div>

                    <!-- Selected User PIN -->
                    <div th:if="${!#lists.isEmpty(eligibleAccounts)}">
                        <div class="mb-3">
                            <label class="form-label">
                                <i class="bi bi-keypad-fill"></i>
                                Selected User PIN
                            </label>
                            <input type="password"
                                   class="form-control"
                                   th:field="*{pin}"
                                   minlength="4"
                                   maxlength="6"
                                   placeholder="Enter the selected user's PIN"
                                   required>
                            <div class="form-text">
                                Enter the PIN of the account you selected above.
                            </div>
                        </div>

                        <button type="submit" class="btn-switch">
                            <i class="bi bi-arrow-left-right"></i>
                            Switch Account
                        </button>

                        <hr class="divider">

                        <a th:href="@{/}" class="btn-cancel">
                            <i class="bi bi-x-lg"></i>
                            Cancel
                        </a>
                    </div>

                    <!-- No accounts - just show cancel -->
                    <div th:if="${#lists.isEmpty(eligibleAccounts)}">
                        <hr class="divider">
                        <a th:href="@{/}" class="btn-cancel">
                            <i class="bi bi-x-lg"></i>
                            Cancel
                        </a>
                    </div>

                </form>

            </div>

        </div>

    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

</body>

</html>
