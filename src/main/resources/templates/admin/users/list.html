<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: header('User Management')}"></head>

<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="flex-grow-1">

    <div class="container py-4">

        <!-- Success Message -->
        <div th:if="${successMessage}"
             class="alert alert-success alert-dismissible fade show"
             role="alert">

            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${successMessage}"></span>

            <button type="button"
                    class="btn-close"
                    data-bs-dismiss="alert">
            </button>

        </div>

        <!-- Error Message -->
        <div th:if="${errorMessage}"
             class="alert alert-danger alert-dismissible fade show"
             role="alert">

            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${errorMessage}"></span>

            <button type="button"
                    class="btn-close"
                    data-bs-dismiss="alert">
            </button>

        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h2 class="fw-bold">
                    <i class="bi bi-people-fill me-2"></i>
                    User Management
                </h2>

                <p class="text-muted mb-0">
                    Manage system users, roles and account status.
                </p>

            </div>

            <a th:href="@{/admin/users/create}" class="btn btn-success">

                <i class="bi bi-person-plus-fill me-2"></i>
                Add User

            </a>

        </div>

        <div class="card shadow-sm">

            <div class="card-body">

                <table class="table table-hover align-middle">

                    <thead class="table-light">

                    <tr>

                        <th>Username</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Created</th>
                        <th>Action</th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="user : ${users}">

                        <td>

                            <strong th:text="${user.username}"></strong>

                        </td>

                        <td>

                            <span class="badge bg-primary"
                                  th:text="${#lists.isEmpty(user.roles) ? 'No Role' : #lists.toList(user.roles)[0].name.replace('ROLE_','')}">
                            </span>

                        </td>

                        <td>

                            <span th:if="${user.enabled}"
                                  class="badge bg-success">

                                Active

                            </span>

                            <span th:unless="${user.enabled}"
                                  class="badge bg-secondary">

                                Disabled

                            </span>

                        </td>

                        <td th:text="${#temporals.format(user.createdAt,'dd MMM yyyy')}"></td>

                        <td>

                            <a class="btn btn-sm btn-primary"
                               th:href="@{/admin/users/{id}/edit(id=${user.userId})}">

                                <i class="bi bi-pencil-square me-1"></i>
                                Edit

                            </a>

                            <a th:href="@{/admin/users/{id}/reset-password(id=${user.userId})}"
                               class="btn btn-sm btn-warning">

                                <i class="bi bi-key me-1"></i>
                                Reset Password

                            </a>

                            <button th:if="${user.enabled}"
                                    class="btn btn-sm btn-danger">

                                <i class="bi bi-person-x-fill me-1"></i>
                                Disable

                            </button>

                            <button th:unless="${user.enabled}"
                                    class="btn btn-sm btn-success">

                                <i class="bi bi-person-check-fill me-1"></i>
                                Enable

                            </button>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>

</html>
