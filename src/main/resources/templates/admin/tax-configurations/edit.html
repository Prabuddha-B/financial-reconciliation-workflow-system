<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: header('Edit Tax Configuration')}"></head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">

    <div class="card shadow-sm">

        <div class="card-header">
            <h3 class="mb-0">
                <i class="bi bi-pencil-square me-2"></i>
                Edit Tax Configuration
            </h3>
        </div>

        <div class="card-body">

            <form th:action="@{/admin/tax-configurations/{id}/edit(id=${configuration.id})}" th:object="${configuration}"
                  method="post">

                <div class="mb-3">
                    <label class="form-label">Module</label>
                    <input class="form-control" th:field="*{module}" readonly>
                </div>

                <div class="mb-3">
                    <label class="form-label">Category</label>
                    <input class="form-control" th:field="*{category}" readonly>
                </div>

                <div class="mb-3">
                    <label class="form-label">Tax Rate (%)</label>

                    <input type="number"
                           step="0.01"
                           min="0"
                           max="100"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('taxRate')} ? ' is-invalid' : ''"
                           th:field="*{taxRate}">

                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('taxRate')}"
                         th:errors="*{taxRate}">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea class="form-control"
                              rows="3"
                              th:classappend="${#fields.hasErrors('description')} ? ' is-invalid' : ''"
                              th:field="*{description}">
                    </textarea>

                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('description')}"
                         th:errors="*{description}">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Status</label>
                    <input class="form-control" th:value="${configuration.isActive ? 'Active' : 'Inactive'}" readonly>
                </div>

                <button class="btn btn-primary">
                    <i class="bi bi-check-circle me-2"></i>
                    Save Changes
                </button>

                <a th:href="@{/admin/tax-configurations}" class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
