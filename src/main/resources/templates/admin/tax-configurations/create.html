<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: header('Create Tax Configuration')}"></head>

<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="flex-grow-1">

        <div class="container py-4">

            <!-- Error Message -->
            <div th:if="${errorMessage}"
                 class="alert alert-danger alert-dismissible fade show"
                 role="alert">

                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${errorMessage}"></span>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="alert">
                </button>

            </div>

        <div class="card shadow-sm">

            <div class="card-header">
                <h3 class="mb-0">
                    <i class="bi bi-plus-circle me-2"></i>
                    Create Tax Configuration
                </h3>
            </div>

            <div class="card-body">

                <form th:action="@{/admin/tax-configurations/create}"
                      th:object="${configuration}"
                      method="post">

                    <div class="mb-3">
                        <label class="form-label">Module</label>

                        <input type="text"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('module')} ? ' is-invalid' : ''"
                               th:field="*{module}"
                               placeholder="e.g. RECEIPT"
                               required>

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('module')}"
                             th:errors="*{module}">
                        </div>

                    </div>

                    <div class="mb-3">
                        <label class="form-label">Category</label>

                        <input type="text"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('category')} ? ' is-invalid' : ''"
                               th:field="*{category}"
                               placeholder="e.g. STANDARD"
                               required>

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('category')}"
                             th:errors="*{category}">
                        </div>

                    </div>

                    <div class="mb-3">
                        <label class="form-label">Tax Rate (%)</label>
                        <input type="number"
                               step="0.01"
                               min="0"
                               max="100"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('taxRate')} ? ' is-invalid' : ''"
                               th:field="*{taxRate}">

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('taxRate')}"
                             th:errors="*{taxRate}">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Description</label>
                            <textarea class="form-control"
                                      th:classappend="${#fields.hasErrors('description')} ? ' is-invalid' : ''"
                                      rows="3"
                                      th:field="*{description}">
                            </textarea>

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('description')}"
                             th:errors="*{description}">
                        </div>
                    </div>

    <!--                <div class="mb-3">-->
    <!--                    <label class="form-label">Status</label>-->
    <!--                    <input class="form-control" th:value="${configuration.isActive ? 'Active' : 'Inactive'}" readonly>-->
    <!--                </div>-->

                    <button class="btn btn-primary">
                        <i class="bi bi-plus-circle me-2"></i>
                        Create Configuration
                    </button>

                    <a th:href="@{/admin/tax-configurations}" class="btn btn-secondary">
                        Cancel
                    </a>

                </form>

            </div>

        </div>

        </div>

    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
