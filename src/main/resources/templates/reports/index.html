<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <title th:text="${report.title}">Report</title>
  <link rel="stylesheet" href="/css/report.css"/>
</head>
<body>
  <div class="container">
    <h1 th:text="${report.title}">Report Title</h1>
    <p>Generated at: <span th:text="${report.generatedAt}">DATE</span></p>

    <table class="metrics">
      <thead>
        <tr><th>Metric</th><th>Value</th></tr>
      </thead>
      <tbody>
        <tr th:each="entry : ${#lists.entries(report.metrics)}">
          <td th:text="${entry.key}">metric</td>
          <td th:text="${entry.value}">value</td>
        </tr>
      </tbody>
    </table>

    <p>
      <a href="/reports/export/csv">Download CSV</a>
    </p>
  </div>
</body>
</html>
