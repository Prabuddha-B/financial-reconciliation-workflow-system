spring.application.name=frwss-system

# Replace 'your_db_name' with the name you created in pgAdmin
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-cool-queen-ao83t4q6.c-2.ap-southeast-1.aws.neon.tech:5432/neondb?sslmode=require}

# the credentials
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD}

# This tells Spring to update your table structure automatically
# the driver and hibernate logic
# spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Security
security.enabled=true

# Development fallback (used only if authentication is unavailable)
security.dev.username=admin
security.dev.role=ADMIN