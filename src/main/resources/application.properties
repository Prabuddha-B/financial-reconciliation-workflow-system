spring.application.name=frwss-system

# Replace 'your_db_name' with the name you created in pgAdmin
spring.datasource.url=${DB_URL}

# the credentials
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# This tells Spring to update your table structure automatically
# the driver and hibernate logic
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# Connection Pool Settings (Important for Neon)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# Security Configuration (Environment Variables)
security.enabled=${SECURITY_ENABLED:false}
security.dev.username=${DEV_USERNAME:admin}
security.dev.role=${DEV_ROLE:REVIEWER}
security.dev.allowed-roles=${DEV_ALLOWED_ROLES:REVIEWER,SUPERVISOR,AUDITOR,ADMIN}

# Reconciliation Configuration
reconciliation.tolerance.default-days=${RECONCILIATION_TOLERANCE_DAYS:3}
reconciliation.tolerance.candidate-search-days=${RECONCILIATION_CANDIDATE_SEARCH_DAYS:7}
reconciliation.batch.size=${RECONCILIATION_BATCH_SIZE:100}
reconciliation.batch.partial-size=${RECONCILIATION_PARTIAL_BATCH_SIZE:50}
reconciliation.confidence.max-score=${RECONCILIATION_MAX_CONFIDENCE:100.0}
reconciliation.confidence.min-score=${RECONCILIATION_MIN_CONFIDENCE:0.0}
reconciliation.confidence.penalty-per-day=${RECONCILIATION_PENALTY_PER_DAY:30.0}

# Audit Configuration
audit.hash.algorithm=${AUDIT_HASH_ALGORITHM:SHA-256}
audit.retention.days=${AUDIT_RETENTION_DAYS:365}

# Workflow Configuration
workflow.timeout.minutes=${WORKFLOW_TIMEOUT_MINUTES:30}

# Session Configuration
server.servlet.session.timeout=${SESSION_TIMEOUT_MINUTES:15}

# Logging Configuration
logging.level.com.frwss.system=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}
logging.level.org.hibernate.SQL=${LOG_LEVEL_SQL:OFF}